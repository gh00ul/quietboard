name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release pushes main and its v* tag for the same commit within seconds, which used to build the
  # same APK twice (and send two failure mails when it broke). A branch push waits a minute and skips
  # the build when that commit has a version tag, so the tag's run is the only one.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.tagged.outputs.build }}
    steps:
      - id: tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 60
          # Lightweight tags only (what `gh release create` makes); an annotated tag just means a second build.
          # If the lookup fails, build anyway.
          if tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[] | select(.object.sha == env.GITHUB_SHA) | .ref') && [ -n "$tags" ]; then
            echo "::notice::This commit is tagged ($tags); that run builds the APK."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The runner image already has the Android SDK (ANDROID_HOME). android-actions/setup-android@v3
      # now fails there: it installs the long-removed "tools" package by default.
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        env:
          QB_KEYSTORE_BASE64: ${{ secrets.QB_KEYSTORE_BASE64 }}
          QB_KEYSTORE_PASSWORD: ${{ secrets.QB_KEYSTORE_PASSWORD }}
          QB_KEY_ALIAS: ${{ secrets.QB_KEY_ALIAS }}
          QB_KEY_PASSWORD: ${{ secrets.QB_KEY_PASSWORD }}
        run: |
          if [ -n "$QB_KEYSTORE_BASE64" ]; then
            echo "$QB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quietboard.jks"
            export QB_KEYSTORE_FILE="$RUNNER_TEMP/quietboard.jks"
          else
            echo "::warning::QB_KEYSTORE_BASE64 secret is not set, so the release APK is unsigned and can't be installed."
          fi
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/quietboard.jks"
      - uses: actions/upload-artifact@v6
        with:
          name: quietboard-apk
          path: app/build/outputs/apk/release/*.apk
